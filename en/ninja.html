<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Fruit Ninja – Conteo (20s)</title>
<style>
  :root{
    --bg:#0b1226;
    --panel:rgba(0,0,0,.72);
    --white:#f8fafc;
    --muted:#cbd5e1;
    --ok:#34c759;
    --bad:#ff3b30;
    --accent:#60a5fa;
  }
  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% 0%, #111a3a 0%, var(--bg) 60%);
    color:var(--white);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden;
    touch-action:none; /* clave para trazo en móvil */
  }

  #hud{
    position:fixed;
    left:0; right:0; top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    gap:12px;
    pointer-events:none;
  }
  #target{
    font-weight:800;
    font-size:22px;
    letter-spacing:.2px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #timer{
    font-weight:800;
    font-size:20px;
    color:var(--muted);
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #sub{
    position:fixed;
    left:0; right:0; top:48px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    pointer-events:none;
  }

  /* Objetos (frutas/bombas) */
  .item{
    position:absolute;
    will-change: transform;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none; /* el corte es por trazo, no por clic */
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.55));
  }
  .emoji{
    font-size:240px; /* +200px vs ~40px */
    line-height:1;
  }
  .badge{
    position:absolute;
    left:50%;
    top:10%;
    transform:translate(-50%,-50%);
    width:44px;height:44px;
    border-radius:999px;
    display:grid;place-items:center;
    font-size:24px;
    background:rgba(0,0,0,.35);
    border:3px solid rgba(255,255,255,.35);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
  }

  /* Overlay pregunta */
  #overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:var(--panel);
    z-index:10;
    padding:18px;
  }
  #card{
    width:min(520px, 92vw);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    padding:18px;
    background:rgba(255,255,255,.06);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  #question{
    margin:0 0 10px 0;
    font-size:22px;
    font-weight:900;
  }
  #options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
  }
  button{
    font-size:20px;
    font-weight:900;
    padding:12px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.28);
    color:var(--white);
    cursor:pointer;
    min-width:86px;
  }
  button:active{transform:scale(.98)}
  #feedback{
    margin:12px 0 0 0;
    font-size:16px;
    color:var(--muted);
    min-height:22px;
    text-align:center;
  }
  #lock{
    margin-top:10px;
    text-align:center;
    color:rgba(255,255,255,.65);
    font-size:14px;
  }

  /* Canvas del trazo */
  #trail{
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="trail"></canvas>

<div id="hud">
  <div id="target">🎯 …</div>
  <div id="timer">⏱ 20</div>
</div>
<div id="sub">Traza una línea para cortar. Evita la bomba del mismo color.</div>

<div id="overlay">
  <div id="card">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback"></p>
    <div id="lock"></div>
  </div>
</div>

<script>
/* =========================
   Config pedagógica
========================= */
const FRUITS = [
  { name:"Piña",    emoji:"🍍", color:"yellow", bombRing:"#ffd54a" },
  { name:"Mango",   emoji:"🥭", color:"orange", bombRing:"#ffb020" },
  { name:"Naranja", emoji:"🍊", color:"orange", bombRing:"#ffb020" }
];

const ROUND_MS = 20000;         // 20 s
const LOCK_MS  = 15000;         // 15 s bloqueo
const MAX_TARGETS = 10;         // máximo 10 frutas objetivo por intento
const MAX_ACTIVE  = 10;         // límite de objetos simultáneos en pantalla
const SPAWN_EVERY_MS = 900;     // frecuencia de lanzamiento (ajustable)
const BOMB_RATE = 0.22;         // probabilidad de que sea bomba (suave)

let round = 0;
let targetFruit = null;

let gameActive = false;
let roundStart = 0;
let roundEndTimer = null;
let spawnTimer = null;
let tickTimer = null;

let cutCount = 0;       // cuántas frutas objetivo cortó
let targetSpawned = 0;  // cuántas frutas objetivo han salido en la ronda

// elementos activos
const items = []; // {el, x,y, vx, vy, ax, ay, t, isBomb, radius, alive}

/* =========================
   HUD + TTS
========================= */
const $target = document.getElementById("target");
const $timer  = document.getElementById("timer");
const $overlay = document.getElementById("overlay");
const $question = document.getElementById("question");
const $options = document.getElementById("options");
const $feedback = document.getElementById("feedback");
const $lock = document.getElementById("lock");

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================
   Canvas trazo
========================= */
const canvas = document.getElementById("trail");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let drawing = false;
let lastPoint = null;
let trailPoints = [];
let trailFade = 0;

function drawTrail(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(trailPoints.length < 2) return;

  // estilo de trazo tipo “sable”
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // capa glow
  ctx.globalAlpha = Math.min(1, trailFade);
  ctx.lineWidth = 16;
  ctx.strokeStyle = "rgba(96,165,250,0.35)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  ctx.stroke();

  // capa principal
  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function addTrailPoint(p){
  trailPoints.push(p);
  if(trailPoints.length > 14) trailPoints.shift();
  trailFade = 1;
  drawTrail();
}

function decayTrail(){
  if(trailPoints.length === 0) return;
  trailFade *= 0.86;
  if(trailFade < 0.05){
    trailPoints = [];
    lastPoint = null;
  }
  drawTrail();
}

/* =========================
   Geometría: colisión trazo (segmento) con círculo
========================= */
function segCircleHit(ax, ay, bx, by, cx, cy, r){
  // distancia mínima del centro del círculo al segmento AB
  const abx = bx - ax, aby = by - ay;
  const acx = cx - ax, acy = cy - ay;
  const ab2 = abx*abx + aby*aby;
  let t = ab2 ? (acx*abx + acy*aby)/ab2 : 0;
  t = Math.max(0, Math.min(1, t));
  const hx = ax + abx*t, hy = ay + aby*t;
  const dx = cx - hx, dy = cy - hy;
  return (dx*dx + dy*dy) <= r*r;
}

/* =========================
   Input unificado (mouse/touch) por Pointer Events
========================= */
window.addEventListener("pointerdown", (e)=>{
  drawing = true;
  lastPoint = {x:e.clientX, y:e.clientY};
  trailPoints = [lastPoint];
  drawTrail();
});

window.addEventListener("pointermove", (e)=>{
  if(!drawing) return;
  const p = {x:e.clientX, y:e.clientY};

  // detección de corte: segmento lastPoint -> p
  if(gameActive && lastPoint){
    for(const it of items){
      if(!it.alive) continue;
      if(segCircleHit(lastPoint.x, lastPoint.y, p.x, p.y, it.x, it.y, it.radius)){
        sliceItem(it);
      }
    }
  }

  addTrailPoint(p);
  lastPoint = p;
});

window.addEventListener("pointerup", ()=>{
  drawing = false;
});
window.addEventListener("pointercancel", ()=>{
  drawing = false;
});

/* =========================
   Motor del juego
========================= */
function clearItems(){
  for(const it of items){
    try{ it.el.remove(); }catch(e){}
  }
  items.length = 0;
}

function setTarget(){
  targetFruit = FRUITS[round % FRUITS.length];
  $target.textContent = `🎯 Corta solo ${targetFruit.name}`;
}

function startRound(){
  clearItems();
  cutCount = 0;
  targetSpawned = 0;

  setTarget();

  gameActive = true;
  roundStart = performance.now();

  // reloj HUD
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    if(!gameActive) return;
    const elapsed = performance.now() - roundStart;
    const remaining = Math.max(0, Math.ceil((ROUND_MS - elapsed)/1000));
    $timer.textContent = `⏱ ${remaining}`;
  }, 120);

  // spawn progresivo
  if(spawnTimer) clearInterval(spawnTimer);
  spawnTimer = setInterval(()=>{
    if(!gameActive) return;
    if(items.filter(i=>i.alive).length >= MAX_ACTIVE) return;
    spawnOne();
  }, SPAWN_EVERY_MS);

  // termina ronda
  if(roundEndTimer) clearTimeout(roundEndTimer);
  roundEndTimer = setTimeout(endRound, ROUND_MS);

  // loop animación
  requestAnimationFrame(step);
}

function spawnOne(){
  // decisión: fruta objetivo o distractor/bomba
  // Restricción: no más de 10 frutas objetivo en toda la ronda.
  const canSpawnTarget = targetSpawned < MAX_TARGETS;
  const spawnTarget = canSpawnTarget && (Math.random() < 0.62); // sesgo a objetivo (ajustable)

  const isBomb = Math.random() < BOMB_RATE;

  // Solo una fruta objetivo por objeto: si es bomba, no cuenta como objetivo
  const fruit = targetFruit;

  // si NO es objetivo (spawnTarget false), lanzamos distractor (otra fruta) o bomba igual
  let shown;
  let isObjective = spawnTarget && !isBomb;

  if(isBomb){
    shown = "💣";
    isObjective = false;
  }else if(spawnTarget){
    shown = fruit.emoji;
    targetSpawned++;
  }else{
    // distractor: otra fruta distinta
    const other = FRUITS.filter(f=>f.name!==fruit.name);
    const pick = other[Math.floor(Math.random()*other.length)];
    shown = pick.emoji;
  }

  // Crear DOM
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `
    <div class="emoji">${shown}</div>
    ${isBomb ? `<div class="badge" title="Bomba" style="border-color:${fruit.bombRing};">⚠️</div>` : ``}
  `;
  document.body.appendChild(el);

  // Estado físico (lanzado desde abajo, arco curvo)
  const w = window.innerWidth;
  const h = window.innerHeight;

  const startX = Math.random()*(w*0.8) + w*0.1;
  const startY = h + 140;

  // velocidad inicial: hacia arriba con variación; vx para curva; ay gravedad
  const vy0 = -(Math.random()*7 + 18);      // arriba
  const vx0 = (Math.random()*10 - 5);       // izquierda/derecha
  const ay  = (Math.random()*0.08 + 0.22);  // gravedad
  const ax  = (Math.random()*0.02 - 0.01);  // leve curva lateral

  const it = {
    el,
    x:startX,
    y:startY,
    vx:vx0,
    vy:vy0,
    ax,
    ay,
    alive:true,
    isBomb,
    isObjective,
    radius: 92, // colisión aprox para emoji grande (ajustable)
  };
  items.push(it);

  // primera posición
  el.style.transform = `translate(${it.x-120}px, ${it.y-140}px)`;
}

function sliceItem(it){
  if(!it.alive) return;
  it.alive = false;

  // efecto simple: reducir/opacidad
  it.el.style.transition = "transform 120ms ease, opacity 120ms ease";
  it.el.style.opacity = "0";
  it.el.style.transform += " scale(0.9)";

  setTimeout(()=>{ try{it.el.remove();}catch(e){} }, 180);

  if(it.isBomb){
    // bomba: termina ronda inmediatamente
    gameActive = false;
    endRound(true);
    return;
  }

  // Solo cuenta si cortó la fruta objetivo (y no distractor)
  if(it.isObjective){
    cutCount++;
  }
}

function step(){
  // animación + limpieza
  if(gameActive){
    for(const it of items){
      if(!it.alive) continue;

      it.vx += it.ax;
      it.vy += it.ay;

      it.x += it.vx;
      it.y += it.vy;

      // si sale de pantalla, muere
      if(it.y > window.innerHeight + 240 || it.x < -260 || it.x > window.innerWidth + 260){
        it.alive = false;
        try{it.el.remove();}catch(e){}
      }else{
        it.el.style.transform = `translate(${it.x-120}px, ${it.y-140}px)`;
      }
    }
  }

  // desvanecer trazo
  decayTrail();

  // continuar loop mientras haya juego activo o trazo visible
  if(gameActive || trailPoints.length){
    requestAnimationFrame(step);
  }
}

function endRound(byBomb=false){
  // evitar múltiples llamadas
  if(roundEndTimer){ clearTimeout(roundEndTimer); roundEndTimer=null; }
  if(spawnTimer){ clearInterval(spawnTimer); spawnTimer=null; }
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }

  gameActive = false;

  // limpiar items visibles
  // (dejamos los que están animando fade, pero mejor limpiar todo)
  clearItems();

  showQuestion(byBomb);
}

/* =========================
   Pregunta (3 opciones cercanas) + feedback + TTS + bloqueo 15s
========================= */
function showQuestion(byBomb){
  $overlay.style.display = "flex";
  $feedback.textContent = "";
  $lock.textContent = "";

  const correct = cutCount;

  // construir 2 distractores cercanos (pero no iguales)
  // aseguramos valores >=0 y dentro de rango plausible
  const d1 = Math.max(0, correct + 1);
  const d2 = Math.max(0, correct - 1);

  // si se repiten, ajustamos
  let options = [correct, d1, d2];

  // garantizar 3 únicos
  options = Array.from(new Set(options));
  while(options.length < 3){
    const extra = Math.max(0, correct + (Math.random()<.5 ? 2 : -2));
    if(!options.includes(extra)) options.push(extra);
  }

  // mezclar
  options.sort(()=>Math.random() - 0.5);

  $question.textContent = byBomb
    ? `💥 ¡Cortaste una bomba! ¿Cuántas ${targetFruit.name}s alcanzaste a cortar?`
    : `¿Cuántas ${targetFruit.name}s cortaste en 20 segundos?`;

  $options.innerHTML = "";
  options.forEach(n=>{
    const b = document.createElement("button");
    b.textContent = n;
    b.onclick = ()=>checkAnswer(n, correct);
    $options.appendChild(b);
  });
}

function checkAnswer(ans, correct){
  // deshabilitar botones
  [...$options.querySelectorAll("button")].forEach(b=>b.disabled=true);

  if(ans === correct){
    $feedback.style.color = "rgba(52,199,89,.95)";
    $feedback.textContent = `✅ Excelente: cortaste ${correct}.`;
    speak(`Excelente. Cortaste ${correct}.`);
  }else{
    $feedback.style.color = "rgba(255,59,48,.95)";
    $feedback.textContent = `❌ Casi. La respuesta correcta era ${correct}.`;
    speak(`Casi. La respuesta correcta era ${correct}.`);
  }

  // bloqueo 15s
  let remaining = Math.ceil(LOCK_MS/1000);
  $lock.textContent = `Siguiente intento disponible en ${remaining} s…`;

  const lockInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(lockInterval);
      $lock.textContent = "✅ Puedes continuar.";
      // continuar automáticamente (o podrías poner botón "Continuar")
      setTimeout(()=>{
        $overlay.style.display = "none";
        round++;
        startRound();
      }, 250);
    }else{
      $lock.textContent = `Siguiente intento disponible en ${remaining} s…`;
    }
  }, 1000);
}

/* =========================
   Inicio
========================= */
startRound();
</script>

</body>
</html>
