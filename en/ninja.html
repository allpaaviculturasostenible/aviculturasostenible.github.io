<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Fruit Ninja – Conteo (20s)</title>
<style>
  :root{
    --bg:#0b1226;
    --panel:rgba(0,0,0,.72);
    --white:#f8fafc;
    --muted:#cbd5e1;
    --ok:#34c759;
    --bad:#ff3b30;
    --accent:#60a5fa;

    /* ✅ tamaño dinámico de fruta (slider 40-200) */
    --fruitSize: 200px;
  }

  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% 0%, #111a3a 0%, var(--bg) 60%);
    color:var(--white);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden;
    touch-action:none; /* clave para trazo en móvil */
  }

  #hud{
    position:fixed;
    left:0; right:0; top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    gap:12px;
    pointer-events:none;
    z-index:20;
  }
  #leftHud{
    display:flex;
    align-items:center;
    gap:10px;
    pointer-events:auto; /* para controles */
  }
  #target{
    font-weight:800;
    font-size:22px;
    letter-spacing:.2px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    pointer-events:none;
  }
  #timer{
    font-weight:800;
    font-size:20px;
    color:var(--muted);
    text-shadow:0 2px 10px rgba(0,0,0,.4);
    pointer-events:none;
  }

  #controls{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(0,0,0,.30);
    border:1px solid rgba(255,255,255,.14);
    padding:8px 10px;
    border-radius:14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.30);
  }
  #fsBtn{
    border-radius:12px;
    padding:8px 10px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.28);
    color:var(--white);
    cursor:pointer;
    font-weight:900;
    font-size:14px;
    white-space:nowrap;
  }
  #fsBtn:active{transform:scale(.98)}

  #sizeWrap{
    display:flex;
    align-items:center;
    gap:8px;
    color:rgba(255,255,255,.85);
    font-size:12px;
    font-weight:800;
  }
  #sizeSlider{
    width:140px;
  }
  #sizeVal{
    min-width:34px;
    text-align:right;
    color:rgba(255,255,255,.85);
  }

  #sub{
    position:fixed;
    left:0; right:0; top:58px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    pointer-events:none;
    z-index:20;
  }

  /* Objetos (frutas/bombas) */
  .item{
    position:absolute;
    will-change: transform;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none; /* el corte es por trazo */
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.55));
  }
  .emoji{
    font-size: var(--fruitSize); /* ✅ ahora depende del slider */
    line-height:1;
  }
  .badge{
    position:absolute;
    left:50%;
    top:10%;
    transform:translate(-50%,-50%);
    width:44px;height:44px;
    border-radius:999px;
    display:grid;place-items:center;
    font-size:24px;
    background:rgba(0,0,0,.35);
    border:3px solid rgba(255,255,255,.35);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
  }

  /* Overlay pregunta */
  #overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:var(--panel);
    z-index:30;
    padding:18px;
  }
  #card{
    width:min(520px, 92vw);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    padding:18px;
    background:rgba(255,255,255,.06);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  #question{
    margin:0 0 10px 0;
    font-size:22px;
    font-weight:900;
  }
  #options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
  }
  button.opt{
    font-size:20px;
    font-weight:900;
    padding:12px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.28);
    color:var(--white);
    cursor:pointer;
    min-width:86px;
  }
  button.opt:active{transform:scale(.98)}
  #feedback{
    margin:12px 0 0 0;
    font-size:16px;
    color:var(--muted);
    min-height:22px;
    text-align:center;
  }
  #lock{
    margin-top:10px;
    text-align:center;
    color:rgba(255,255,255,.65);
    font-size:14px;
  }

  /* Canvas del trazo */
  #trail{
    position:fixed;
    inset:0;
    z-index:25;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="trail"></canvas>

<div id="hud">
  <div id="leftHud">
    <div id="controls">
      <button id="fsBtn" type="button">⛶ Pantalla completa</button>
      <div id="sizeWrap">
        <span>🍉 Tamaño</span>
        <input id="sizeSlider" type="range" min="40" max="200" value="200" />
        <span id="sizeVal">200</span>
      </div>
    </div>
    <div id="target">🎯 …</div>
  </div>
  <div id="timer">⏱ 20</div>
</div>

<div id="sub">Traza una línea para cortar. Evita la bomba del mismo color.</div>

<div id="overlay">
  <div id="card">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback"></p>
    <div id="lock"></div>
  </div>
</div>

<script>
/* =========================
   Config pedagógica
========================= */
const FRUITS = [
  { name:"Piña",    emoji:"🍍", color:"yellow", bombRing:"#ffd54a" },
  { name:"Mango",   emoji:"🥭", color:"orange", bombRing:"#ffb020" },
  { name:"Naranja", emoji:"🍊", color:"orange", bombRing:"#ffb020" }
];

const ROUND_MS = 20000;         // 20 s
const LOCK_MS  = 10000;         // ✅ 10 s bloqueo (antes 15)
const MAX_TARGETS = 10;         // máximo 10 frutas objetivo por intento
const MAX_ACTIVE  = 10;         // límite de objetos simultáneos en pantalla
const SPAWN_EVERY_MS = 900;     // frecuencia de lanzamiento
const BOMB_RATE = 0.22;         // probabilidad de bomba

let round = 0;
let targetFruit = null;

let gameActive = false;
let roundStart = 0;
let roundEndTimer = null;
let spawnTimer = null;
let tickTimer = null;

let cutCount = 0;
let targetSpawned = 0;

// elementos activos
const items = []; // {el, x,y, vx, vy, ax, ay, alive, isBomb, isObjective, radius}

/* =========================
   HUD + TTS + Controles
========================= */
const $target = document.getElementById("target");
const $timer  = document.getElementById("timer");
const $overlay = document.getElementById("overlay");
const $question = document.getElementById("question");
const $options = document.getElementById("options");
const $feedback = document.getElementById("feedback");
const $lock = document.getElementById("lock");

const $fsBtn = document.getElementById("fsBtn");
const $sizeSlider = document.getElementById("sizeSlider");
const $sizeVal = document.getElementById("sizeVal");

function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    speechSynthesis.speak(u);
  }catch(e){}
}

function isFullscreen(){
  return !!document.fullscreenElement;
}

$fsBtn.addEventListener("click", async ()=>{
  try{
    if(!isFullscreen()){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }
  }catch(e){}
  updateFsBtn();
});

document.addEventListener("fullscreenchange", updateFsBtn);

function updateFsBtn(){
  $fsBtn.textContent = isFullscreen() ? "⤫ Salir" : "⛶ Pantalla completa";
}

function setFruitSize(px){
  document.documentElement.style.setProperty("--fruitSize", px + "px");
  $sizeVal.textContent = px;
}
$sizeSlider.addEventListener("input", ()=>{
  setFruitSize(parseInt($sizeSlider.value,10));
});

// tamaño inicial
setFruitSize(parseInt($sizeSlider.value,10));
updateFsBtn();

/* =========================
   Canvas trazo
========================= */
const canvas = document.getElementById("trail");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let drawing = false;
let lastPoint = null;
let trailPoints = [];
let trailFade = 0;

function drawTrail(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(trailPoints.length < 2) return;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.globalAlpha = Math.min(1, trailFade);
  ctx.lineWidth = 16;
  ctx.strokeStyle = "rgba(96,165,250,0.35)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  ctx.stroke();

  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x, trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function addTrailPoint(p){
  trailPoints.push(p);
  if(trailPoints.length > 14) trailPoints.shift();
  trailFade = 1;
  drawTrail();
}

function decayTrail(){
  if(trailPoints.length === 0) return;
  trailFade *= 0.86;
  if(trailFade < 0.05){
    trailPoints = [];
    lastPoint = null;
  }
  drawTrail();
}

/* =========================
   Geometría: colisión trazo (segmento) con círculo
========================= */
function segCircleHit(ax, ay, bx, by, cx, cy, r){
  const abx = bx - ax, aby = by - ay;
  const acx = cx - ax, acy = cy - ay;
  const ab2 = abx*abx + aby*aby;
  let t = ab2 ? (acx*abx + acy*aby)/ab2 : 0;
  t = Math.max(0, Math.min(1, t));
  const hx = ax + abx*t, hy = ay + aby*t;
  const dx = cx - hx, dy = cy - hy;
  return (dx*dx + dy*dy) <= r*r;
}

/* =========================
   Input por Pointer Events
========================= */
window.addEventListener("pointerdown", (e)=>{
  drawing = true;
  lastPoint = {x:e.clientX, y:e.clientY};
  trailPoints = [lastPoint];
  drawTrail();
});

window.addEventListener("pointermove", (e)=>{
  if(!drawing) return;
  const p = {x:e.clientX, y:e.clientY};

  if(gameActive && lastPoint){
    for(const it of items){
      if(!it.alive) continue;
      if(segCircleHit(lastPoint.x, lastPoint.y, p.x, p.y, it.x, it.y, it.radius)){
        sliceItem(it);
      }
    }
  }

  addTrailPoint(p);
  lastPoint = p;
});

window.addEventListener("pointerup", ()=>{ drawing=false; });
window.addEventListener("pointercancel", ()=>{ drawing=false; });

/* =========================
   Motor del juego
========================= */
function clearItems(){
  for(const it of items){
    try{ it.el.remove(); }catch(e){}
  }
  items.length = 0;
}

function setTarget(){
  targetFruit = FRUITS[round % FRUITS.length];
  $target.textContent = `🎯 Corta solo ${targetFruit.name}`;
}

function getFruitSizePx(){
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fruitSize"),10) || 200;
}

// Radio de colisión proporcional al tamaño (ajusta “facilidad” al cortar)
function getCollisionRadius(){
  const s = getFruitSizePx();
  return Math.max(14, Math.round(s * 0.38)); // 200->76, 40->15
}

function startRound(){
  clearItems();
  cutCount = 0;
  targetSpawned = 0;

  setTarget();

  gameActive = true;
  roundStart = performance.now();

  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    if(!gameActive) return;
    const elapsed = performance.now() - roundStart;
    const remaining = Math.max(0, Math.ceil((ROUND_MS - elapsed)/1000));
    $timer.textContent = `⏱ ${remaining}`;
  }, 120);

  if(spawnTimer) clearInterval(spawnTimer);
  spawnTimer = setInterval(()=>{
    if(!gameActive) return;
    if(items.filter(i=>i.alive).length >= MAX_ACTIVE) return;
    spawnOne();
  }, SPAWN_EVERY_MS);

  if(roundEndTimer) clearTimeout(roundEndTimer);
  roundEndTimer = setTimeout(endRound, ROUND_MS);

  requestAnimationFrame(step);
}

function spawnOne(){
  const canSpawnTarget = targetSpawned < MAX_TARGETS;
  const spawnTarget = canSpawnTarget && (Math.random() < 0.62);
  const isBomb = Math.random() < BOMB_RATE;

  const fruit = targetFruit;

  let shown;
  let isObjective = spawnTarget && !isBomb;

  if(isBomb){
    shown = "💣";
    isObjective = false;
  }else if(spawnTarget){
    shown = fruit.emoji;
    targetSpawned++;
  }else{
    const other = FRUITS.filter(f=>f.name!==fruit.name);
    const pick = other[Math.floor(Math.random()*other.length)];
    shown = pick.emoji;
  }

  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = `
    <div class="emoji">${shown}</div>
    ${isBomb ? `<div class="badge" title="Bomba" style="border-color:${fruit.bombRing};">⚠️</div>` : ``}
  `;
  document.body.appendChild(el);

  const w = window.innerWidth;
  const h = window.innerHeight;

  const startX = Math.random()*(w*0.8) + w*0.1;
  const startY = h + 140;

  const vy0 = -(Math.random()*7 + 18);
  const vx0 = (Math.random()*10 - 5);
  const ay  = (Math.random()*0.08 + 0.22);
  const ax  = (Math.random()*0.02 - 0.01);

  const it = {
    el,
    x:startX,
    y:startY,
    vx:vx0,
    vy:vy0,
    ax,
    ay,
    alive:true,
    isBomb,
    isObjective,
    radius: getCollisionRadius(),
  };
  items.push(it);

  // centrar aproximadamente el emoji según tamaño actual
  const s = getFruitSizePx();
  el.style.transform = `translate(${it.x - (s/2)}px, ${it.y - (s/2)}px)`;
}

function sliceItem(it){
  if(!it.alive) return;
  it.alive = false;

  it.el.style.transition = "transform 120ms ease, opacity 120ms ease";
  it.el.style.opacity = "0";
  it.el.style.transform += " scale(0.9)";
  setTimeout(()=>{ try{it.el.remove();}catch(e){} }, 180);

  if(it.isBomb){
    gameActive = false;
    endRound(true);
    return;
  }

  if(it.isObjective){
    cutCount++;
  }
}

function step(){
  if(gameActive){
    for(const it of items){
      if(!it.alive) continue;

      it.vx += it.ax;
      it.vy += it.ay;

      it.x += it.vx;
      it.y += it.vy;

      // actualiza radio si cambió el tamaño (para coherencia)
      it.radius = getCollisionRadius();

      const s = getFruitSizePx();
      if(it.y > window.innerHeight + s + 80 || it.x < -s-80 || it.x > window.innerWidth + s+80){
        it.alive = false;
        try{it.el.remove();}catch(e){}
      }else{
        it.el.style.transform = `translate(${it.x - (s/2)}px, ${it.y - (s/2)}px)`;
      }
    }
  }

  decayTrail();

  if(gameActive || trailPoints.length){
    requestAnimationFrame(step);
  }
}

function endRound(byBomb=false){
  if(roundEndTimer){ clearTimeout(roundEndTimer); roundEndTimer=null; }
  if(spawnTimer){ clearInterval(spawnTimer); spawnTimer=null; }
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }

  gameActive = false;
  clearItems();
  showQuestion(byBomb);
}

/* =========================
   Pregunta + feedback + TTS + bloqueo 10s
========================= */
function showQuestion(byBomb){
  $overlay.style.display = "flex";
  $feedback.textContent = "";
  $lock.textContent = "";

  const correct = cutCount;

  const d1 = Math.max(0, correct + 1);
  const d2 = Math.max(0, correct - 1);

  let options = [correct, d1, d2];
  options = Array.from(new Set(options));
  while(options.length < 3){
    const extra = Math.max(0, correct + (Math.random()<.5 ? 2 : -2));
    if(!options.includes(extra)) options.push(extra);
  }
  options.sort(()=>Math.random() - 0.5);

  $question.textContent = byBomb
    ? `💥 ¡Cortaste una bomba! ¿Cuántas ${targetFruit.name}s alcanzaste a cortar?`
    : `¿Cuántas ${targetFruit.name}s cortaste en 20 segundos?`;

  $options.innerHTML = "";
  options.forEach(n=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = n;
    b.onclick = ()=>checkAnswer(n, correct);
    $options.appendChild(b);
  });
}

function checkAnswer(ans, correct){
  [...$options.querySelectorAll("button")].forEach(b=>b.disabled=true);

  if(ans === correct){
    $feedback.style.color = "rgba(52,199,89,.95)";
    $feedback.textContent = `✅ Excelente: cortaste ${correct}.`;
    speak(`Excelente. Cortaste ${correct}.`);
  }else{
    $feedback.style.color = "rgba(255,59,48,.95)";
    $feedback.textContent = `❌ Casi. La respuesta correcta era ${correct}.`;
    speak(`Casi. La respuesta correcta era ${correct}.`);
  }

  let remaining = Math.ceil(LOCK_MS/1000);
  $lock.textContent = `Siguiente intento disponible en ${remaining} s…`;

  const lockInterval = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(lockInterval);
      $lock.textContent = "✅ Puedes continuar.";
      setTimeout(()=>{
        $overlay.style.display = "none";
        round++;
        startRound();
      }, 250);
    }else{
      $lock.textContent = `Siguiente intento disponible en ${remaining} s…`;
    }
  }, 1000);
}

/* =========================
   Inicio
========================= */
startRound();
</script>

</body>
</html>
