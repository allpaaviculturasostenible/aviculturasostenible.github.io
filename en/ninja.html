<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Fruit Ninja – Conteo (20s)</title>
<style>
  :root{
    --bg:#0b1226;
    --panel:rgba(0,0,0,.72);
    --white:#f8fafc;
    --muted:#cbd5e1;
    --accent:#60a5fa;

    /* ✅ tamaño dinámico (default 90) */
    --fruitSize: 90px;
  }

  html,body{height:100%}
  body{
    margin:0;
    background: radial-gradient(1200px 600px at 50% 0%, #111a3a 0%, var(--bg) 60%);
    color:var(--white);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow:hidden;
    touch-action:none;
  }

  /* ===== HUD ===== */
  #hud{
    position:fixed;
    left:0; right:0; top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    gap:10px;
    z-index:50;
    pointer-events:none;
  }
  #hudLeft{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #target{
    font-weight:900;
    font-size:22px;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #timer{
    font-weight:900;
    font-size:20px;
    color:var(--muted);
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }

  /* ✅ Botones HUD (sí reciben clic) */
  .hudBtn{
    pointer-events:auto;
    border-radius:14px;
    padding:10px 12px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(0,0,0,.25);
    color:var(--white);
    font-weight:900;
    cursor:pointer;
  }
  .hudBtn:active{transform:scale(.98)}

  #sub{
    position:fixed;
    left:0; right:0; top:54px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
    z-index:40;
    pointer-events:none;
  }

  /* ===== Panel configuración (drawer) ===== */
  #configPanel{
    position:fixed;
    top:0; left:0;
    height:100%;
    width:min(340px, 86vw);
    transform:translateX(-110%);
    transition:transform 220ms ease;
    z-index:80;
    background:rgba(0,0,0,.62);
    backdrop-filter: blur(8px);
    border-right:1px solid rgba(255,255,255,.14);
    box-shadow: 18px 0 50px rgba(0,0,0,.55);
    padding:14px;
    pointer-events:auto;
  }
  #configPanel.open{ transform:translateX(0); }

  #configTitle{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  #configTitle h3{
    margin:0;
    font-size:16px;
    font-weight:900;
    letter-spacing:.2px;
  }

  .row{
    margin:14px 0;
    padding:12px;
    border-radius:16px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
  }
  .rowTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .label{
    font-size:13px;
    color:rgba(255,255,255,.9);
    font-weight:900;
  }
  .val{
    font-size:13px;
    color:rgba(255,255,255,.75);
    font-weight:900;
    min-width:64px;
    text-align:right;
  }
  input[type="range"]{ width:100%; }

  #configHint{
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,.65);
    line-height:1.3;
  }

  /* capa para cerrar tocando afuera */
  #shade{
    position:fixed; inset:0;
    background:rgba(0,0,0,.30);
    z-index:70;
    display:none;
  }
  #shade.on{ display:block; }

  /* ===== Items ===== */
  .item{
    position:absolute;
    will-change: transform;
    user-select:none;
    -webkit-user-select:none;
    pointer-events:none;
    filter: drop-shadow(0 14px 18px rgba(0,0,0,.55));
  }
  .emoji{
    font-size: var(--fruitSize);
    line-height:1;
  }
  .badge{
    position:absolute;
    left:50%;
    top:10%;
    transform:translate(-50%,-50%);
    width:40px;height:40px;
    border-radius:999px;
    display:grid;place-items:center;
    font-size:22px;
    background:rgba(0,0,0,.35);
    border:3px solid rgba(255,255,255,.35);
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.45));
  }

  /* ===== Overlay pregunta ===== */
  #overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    background:rgba(0,0,0,.72);
    z-index:90;
    padding:18px;
  }
  #card{
    width:min(520px, 92vw);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    padding:18px;
    background:rgba(255,255,255,.06);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  #question{ margin:0 0 10px 0; font-size:22px; font-weight:900; }
  #options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:10px;
  }
  button.opt{
    font-size:20px;
    font-weight:900;
    padding:12px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(0,0,0,.28);
    color:var(--white);
    cursor:pointer;
    min-width:86px;
  }
  button.opt:active{transform:scale(.98)}
  #feedback{ margin:12px 0 0 0; font-size:16px; min-height:22px; text-align:center; color:rgba(255,255,255,.8); }
  #lock{ margin-top:10px; text-align:center; color:rgba(255,255,255,.65); font-size:14px; }

  /* Canvas del trazo */
  #trail{
    position:fixed;
    inset:0;
    z-index:60;
    pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="trail"></canvas>

<!-- sombra para cerrar panel -->
<div id="shade"></div>

<!-- Panel de configuración -->
<aside id="configPanel" aria-label="Configuración">
  <div id="configTitle">
    <h3>⚙️ Configuración</h3>
    <button class="hudBtn" id="closeCfg" type="button">Cerrar</button>
  </div>

  <div class="row">
    <div class="rowTop">
      <span class="label">🍉 Tamaño fruta</span>
      <span class="val" id="sizeVal">90px</span>
    </div>
    <input id="sizeSlider" type="range" min="40" max="200" value="90" />
  </div>

  <div class="row">
    <div class="rowTop">
      <span class="label">🚀 Fuerza de lanzamiento</span>
      <span class="val" id="launchVal">1.00×</span>
    </div>
    <input id="launchSlider" type="range" min="60" max="140" value="100" />
  </div>

  <div class="row">
    <div class="rowTop">
      <span class="label">🌍 Gravedad</span>
      <span class="val" id="gravVal">1.00×</span>
    </div>
    <input id="gravSlider" type="range" min="60" max="160" value="100" />
  </div>

  <div id="configHint">
    • Tamaño pequeño = más reto motriz.<br>
    • Más lanzamiento = suben más.<br>
    • Más gravedad = caen más rápido.
  </div>
</aside>

<!-- HUD -->
<div id="hud">
  <div id="hudLeft">
    <button class="hudBtn" id="cfgBtn" type="button">⚙️</button>
    <button class="hudBtn" id="fsBtn" type="button">⛶</button>
    <div id="target">🎯 …</div>
  </div>
  <div id="timer">⏱ 20</div>
</div>
<div id="sub">Traza una línea para cortar. Evita la bomba del mismo color.</div>

<!-- Overlay de pregunta -->
<div id="overlay">
  <div id="card">
    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="feedback"></p>
    <div id="lock"></div>
  </div>
</div>

<script>
/* =========================
   Config general
========================= */
const FRUITS = [
  { name:"Piña",    emoji:"🍍", bombRing:"#ffd54a" },
  { name:"Mango",   emoji:"🥭", bombRing:"#ffb020" },
  { name:"Naranja", emoji:"🍊", bombRing:"#ffb020" }
];

const ROUND_MS = 20000;
const LOCK_MS  = 10000;        // 10s
const MAX_TARGETS = 10;
const MAX_ACTIVE  = 10;
const SPAWN_EVERY_MS = 900;
const BOMB_RATE = 0.22;

let round = 0;
let targetFruit = null;

let gameActive = false;
let roundStart = 0;
let roundEndTimer = null;
let spawnTimer = null;
let tickTimer = null;

let cutCount = 0;
let targetSpawned = 0;

const items = [];

/* =========================
   DOM refs
========================= */
const $target = document.getElementById("target");
const $timer  = document.getElementById("timer");
const $overlay = document.getElementById("overlay");
const $question = document.getElementById("question");
const $options = document.getElementById("options");
const $feedback = document.getElementById("feedback");
const $lock = document.getElementById("lock");

const $fsBtn = document.getElementById("fsBtn");
const $cfgBtn = document.getElementById("cfgBtn");
const $cfgPanel = document.getElementById("configPanel");
const $shade = document.getElementById("shade");
const $closeCfg = document.getElementById("closeCfg");

const $sizeSlider = document.getElementById("sizeSlider");
const $launchSlider = document.getElementById("launchSlider");
const $gravSlider = document.getElementById("gravSlider");

const $sizeVal = document.getElementById("sizeVal");
const $launchVal = document.getElementById("launchVal");
const $gravVal = document.getElementById("gravVal");

/* =========================
   Helpers: TTS
========================= */
function speak(text){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================
   Fullscreen
========================= */
function isFullscreen(){ return !!document.fullscreenElement; }
async function toggleFullscreen(){
  try{
    if(!isFullscreen()) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
  $fsBtn.textContent = isFullscreen() ? "⤫" : "⛶";
}
$fsBtn.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", ()=> {
  $fsBtn.textContent = isFullscreen() ? "⤫" : "⛶";
});

/* =========================
   Panel configuración
========================= */
function openCfg(){
  $cfgPanel.classList.add("open");
  $shade.classList.add("on");
}
function closeCfg(){
  $cfgPanel.classList.remove("open");
  $shade.classList.remove("on");
}
$cfgBtn.addEventListener("click", ()=>{
  if($cfgPanel.classList.contains("open")) closeCfg();
  else openCfg();
});
$closeCfg.addEventListener("click", closeCfg);
$shade.addEventListener("click", closeCfg);

/* =========================
   Sliders -> variables
========================= */
let launchMul = 1.0; // 0.60 .. 1.40
let gravMul   = 1.0; // 0.60 .. 1.60

function setFruitSize(px){
  document.documentElement.style.setProperty("--fruitSize", px + "px");
  $sizeVal.textContent = px + "px";
}
function setLaunchMul(){
  launchMul = parseInt($launchSlider.value,10)/100;
  $launchVal.textContent = launchMul.toFixed(2) + "×";
}
function setGravMul(){
  gravMul = parseInt($gravSlider.value,10)/100;
  $gravVal.textContent = gravMul.toFixed(2) + "×";
}

$sizeSlider.addEventListener("input", ()=> setFruitSize(parseInt($sizeSlider.value,10)));
$launchSlider.addEventListener("input", setLaunchMul);
$gravSlider.addEventListener("input", setGravMul);

// defaults
setFruitSize(90);
setLaunchMul();
setGravMul();

/* =========================
   Canvas trazo
========================= */
const canvas = document.getElementById("trail");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let drawing=false;
let lastPoint=null;
let trailPoints=[];
let trailFade=0;

function drawTrail(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
  if(trailPoints.length<2) return;

  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.globalAlpha=Math.min(1,trailFade);
  ctx.lineWidth=16;
  ctx.strokeStyle="rgba(96,165,250,0.35)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x,trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x,trailPoints[i].y);
  ctx.stroke();

  ctx.lineWidth=6;
  ctx.strokeStyle="rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.moveTo(trailPoints[0].x,trailPoints[0].y);
  for(let i=1;i<trailPoints.length;i++) ctx.lineTo(trailPoints[i].x,trailPoints[i].y);
  ctx.stroke();

  ctx.globalAlpha=1;
}
function addTrailPoint(p){
  trailPoints.push(p);
  if(trailPoints.length>14) trailPoints.shift();
  trailFade=1;
  drawTrail();
}
function decayTrail(){
  if(trailPoints.length===0) return;
  trailFade*=0.86;
  if(trailFade<0.05){
    trailPoints=[];
    lastPoint=null;
  }
  drawTrail();
}

/* colisión segmento-círculo */
function segCircleHit(ax,ay,bx,by,cx,cy,r){
  const abx=bx-ax, aby=by-ay;
  const acx=cx-ax, acy=cy-ay;
  const ab2=abx*abx+aby*aby;
  let t=ab2 ? (acx*abx+acy*aby)/ab2 : 0;
  t=Math.max(0,Math.min(1,t));
  const hx=ax+abx*t, hy=ay+aby*t;
  const dx=cx-hx, dy=cy-hy;
  return (dx*dx+dy*dy) <= r*r;
}

/* input por pointer */
window.addEventListener("pointerdown",(e)=>{
  drawing=true;
  lastPoint={x:e.clientX,y:e.clientY};
  trailPoints=[lastPoint];
  drawTrail();
});
window.addEventListener("pointermove",(e)=>{
  if(!drawing) return;
  const p={x:e.clientX,y:e.clientY};

  if(gameActive && lastPoint){
    for(const it of items){
      if(!it.alive) continue;
      if(segCircleHit(lastPoint.x,lastPoint.y,p.x,p.y,it.x,it.y,it.radius)){
        sliceItem(it);
      }
    }
  }

  addTrailPoint(p);
  lastPoint=p;
});
window.addEventListener("pointerup",()=> drawing=false);
window.addEventListener("pointercancel",()=> drawing=false);

/* =========================
   Motor del juego
========================= */
function clearItems(){
  for(const it of items){ try{it.el.remove();}catch(e){} }
  items.length=0;
}

function setTarget(){
  targetFruit = FRUITS[round % FRUITS.length];
  $target.textContent = `🎯 Corta solo ${targetFruit.name}`;
}

function getFruitSizePx(){
  return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fruitSize"),10) || 90;
}
function getCollisionRadius(){
  const s=getFruitSizePx();
  return Math.max(14, Math.round(s*0.38)); // coherente con tamaño
}

function startRound(){
  clearItems();
  cutCount=0;
  targetSpawned=0;

  setTarget();
  gameActive=true;
  roundStart=performance.now();

  if(tickTimer) clearInterval(tickTimer);
  tickTimer=setInterval(()=>{
    if(!gameActive) return;
    const elapsed=performance.now()-roundStart;
    const remaining=Math.max(0, Math.ceil((ROUND_MS-elapsed)/1000));
    $timer.textContent=`⏱ ${remaining}`;
  },120);

  if(spawnTimer) clearInterval(spawnTimer);
  spawnTimer=setInterval(()=>{
    if(!gameActive) return;
    if(items.filter(i=>i.alive).length>=MAX_ACTIVE) return;
    spawnOne();
  },SPAWN_EVERY_MS);

  if(roundEndTimer) clearTimeout(roundEndTimer);
  roundEndTimer=setTimeout(endRound,ROUND_MS);

  requestAnimationFrame(step);
}

function spawnOne(){
  const canSpawnTarget = targetSpawned < MAX_TARGETS;
  const spawnTarget = canSpawnTarget && (Math.random() < 0.62);
  const isBomb = Math.random() < BOMB_RATE;

  const fruit = targetFruit;
  let shown, isObjective = spawnTarget && !isBomb;

  if(isBomb){
    shown="💣";
    isObjective=false;
  }else if(spawnTarget){
    shown=fruit.emoji;
    targetSpawned++;
  }else{
    const other=FRUITS.filter(f=>f.name!==fruit.name);
    const pick=other[Math.floor(Math.random()*other.length)];
    shown=pick.emoji;
  }

  const el=document.createElement("div");
  el.className="item";
  el.innerHTML=`
    <div class="emoji">${shown}</div>
    ${isBomb ? `<div class="badge" style="border-color:${fruit.bombRing};">⚠️</div>` : ``}
  `;
  document.body.appendChild(el);

  const w=window.innerWidth, h=window.innerHeight;
  const s=getFruitSizePx();

  const startX = Math.random()*(w*0.8) + w*0.1;
  const startY = h + s;

  // ✅ lanzamiento y gravedad escalados por sliders
  const vy0 = -(Math.random()*7 + 18) * launchMul;         // más lanzamiento => suben más
  const vx0 = (Math.random()*10 - 5) * (0.9 + 0.3*launchMul);
  const ay  = (Math.random()*0.08 + 0.22) * gravMul;       // más gravedad => caen más rápido
  const ax  = (Math.random()*0.02 - 0.01) * (0.7 + 0.3*launchMul);

  const it={
    el, x:startX, y:startY,
    vx:vx0, vy:vy0, ax, ay,
    alive:true,
    isBomb,
    isObjective,
    radius:getCollisionRadius(),
  };
  items.push(it);

  el.style.transform=`translate(${it.x-(s/2)}px, ${it.y-(s/2)}px)`;
}

function sliceItem(it){
  if(!it.alive) return;
  it.alive=false;

  it.el.style.transition="transform 120ms ease, opacity 120ms ease";
  it.el.style.opacity="0";
  it.el.style.transform += " scale(0.9)";
  setTimeout(()=>{ try{it.el.remove();}catch(e){} },180);

  if(it.isBomb){
    gameActive=false;
    endRound(true);
    return;
  }
  if(it.isObjective) cutCount++;
}

function step(){
  if(gameActive){
    for(const it of items){
      if(!it.alive) continue;

      it.vx += it.ax;
      it.vy += it.ay;

      it.x += it.vx;
      it.y += it.vy;

      // coherencia con cambios de tamaño en vivo
      const s=getFruitSizePx();
      it.radius=getCollisionRadius();

      if(it.y > window.innerHeight + s + 80 || it.x < -s-80 || it.x > window.innerWidth + s+80){
        it.alive=false;
        try{it.el.remove();}catch(e){}
      }else{
        it.el.style.transform=`translate(${it.x-(s/2)}px, ${it.y-(s/2)}px)`;
      }
    }
  }

  decayTrail();

  if(gameActive || trailPoints.length){
    requestAnimationFrame(step);
  }
}

function endRound(byBomb=false){
  if(roundEndTimer){ clearTimeout(roundEndTimer); roundEndTimer=null; }
  if(spawnTimer){ clearInterval(spawnTimer); spawnTimer=null; }
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }

  gameActive=false;
  clearItems();
  showQuestion(byBomb);
}

/* =========================
   Pregunta + feedback + TTS + bloqueo 10s
========================= */
function showQuestion(byBomb){
  $overlay.style.display="flex";
  $feedback.textContent="";
  $lock.textContent="";

  const correct=cutCount;

  const d1=Math.max(0, correct+1);
  const d2=Math.max(0, correct-1);

  let options=[correct,d1,d2];
  options=Array.from(new Set(options));
  while(options.length<3){
    const extra=Math.max(0, correct + (Math.random()<.5 ? 2 : -2));
    if(!options.includes(extra)) options.push(extra);
  }
  options.sort(()=>Math.random()-0.5);

  $question.textContent = byBomb
    ? `💥 ¡Cortaste una bomba! ¿Cuántas ${targetFruit.name}s alcanzaste a cortar?`
    : `¿Cuántas ${targetFruit.name}s cortaste en 20 segundos?`;

  $options.innerHTML="";
  options.forEach(n=>{
    const b=document.createElement("button");
    b.className="opt";
    b.textContent=n;
    b.onclick=()=>checkAnswer(n,correct);
    $options.appendChild(b);
  });
}

function checkAnswer(ans, correct){
  [...$options.querySelectorAll("button")].forEach(b=>b.disabled=true);

  if(ans===correct){
    $feedback.style.color="rgba(52,199,89,.95)";
    $feedback.textContent=`✅ Excelente: cortaste ${correct}.`;
    speak(`Excelente. Cortaste ${correct}.`);
  }else{
    $feedback.style.color="rgba(255,59,48,.95)";
    $feedback.textContent=`❌ Casi. La respuesta correcta era ${correct}.`;
    speak(`Casi. La respuesta correcta era ${correct}.`);
  }

  let remaining=Math.ceil(LOCK_MS/1000);
  $lock.textContent=`Siguiente intento disponible en ${remaining} s…`;

  const lockInterval=setInterval(()=>{
    remaining--;
    if(remaining<=0){
      clearInterval(lockInterval);
      $lock.textContent="✅ Puedes continuar.";
      setTimeout(()=>{
        $overlay.style.display="none";
        round++;
        startRound();
      },250);
    }else{
      $lock.textContent=`Siguiente intento disponible en ${remaining} s…`;
    }
  },1000);
}

/* =========================
   Inicio
========================= */
startRound();
</script>

</body>
</html>
