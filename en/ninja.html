<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Tica vs Shadow – Arcade Matemático (HTML5)</title>
  <style>
    :root{
      --bg:#070a14;
      --panel:rgba(255,255,255,.08);
      --panel2:rgba(0,0,0,.35);
      --text:#f8fafc;
      --muted:#cbd5e1;
      --ok:#34c759;
      --bad:#ff3b30;
      --purple:#b56bff;
      --border:rgba(255,255,255,.18);
      --shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:radial-gradient(1200px 900px at 50% 20%, #10183b 0%, var(--bg) 60%, #04060f 100%);
      color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
    }
    .hud{
      position:fixed; inset:12px 12px auto 12px;
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      pointer-events:none;
    }
    .hud .left, .hud .right{
      display:flex; gap:10px; align-items:center;
      background:var(--panel); border:1px solid var(--border);
      border-radius:14px; padding:10px 12px; box-shadow:var(--shadow);
      backdrop-filter: blur(8px);
      pointer-events:auto;
    }
    .badge{
      display:flex; gap:8px; align-items:center; font-weight:700;
    }
    .muted{color:var(--muted); font-weight:600}
    .btn{
      pointer-events:auto;
      cursor:pointer; user-select:none;
      background:rgba(255,255,255,.10);
      border:1px solid var(--border);
      color:var(--text);
      padding:8px 10px; border-radius:12px; font-weight:800;
    }
    .btn:active{transform:translateY(1px)}
    canvas{display:block; width:100vw; height:100vh;}
    /* FX overlay for slow motion */
    .slowmo-vignette{
      position:fixed; inset:0;
      background: radial-gradient(600px 400px at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.45) 100%);
      opacity:0; pointer-events:none; transition:opacity .12s ease;
      mix-blend-mode:multiply;
    }
    .slowmo-vignette.on{opacity:1;}
    /* Question modal */
    .modal{
      position:fixed; inset:0; display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      padding:16px;
    }
    .modal.on{display:flex;}
    .card{
      width:min(560px, 100%);
      background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px 16px 14px;
      box-shadow:var(--shadow);
    }
    .title{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-bottom:10px;
    }
    .title h2{margin:0; font-size:16px; letter-spacing:.2px}
    .pill{
      display:flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.14);
      font-weight:800;
    }
    .pill .t{color:var(--purple)}
    .q{
      background:rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      padding:14px;
      display:grid; gap:10px;
    }
    .expr{
      font-size:28px; font-weight:900;
      letter-spacing:.5px;
      display:flex; align-items:center; justify-content:center;
    }
    .row{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center;
    }
    input[type="number"]{
      width:180px; max-width:60vw;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(0,0,0,.25);
      color:var(--text);
      font-size:16px; font-weight:800;
      outline:none;
    }
    .submit{
      background:rgba(181,107,255,.18);
      border:1px solid rgba(181,107,255,.45);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      font-weight:900; cursor:pointer;
    }
    .submit:active{transform:translateY(1px)}
    .hint{
      text-align:center;
      font-size:13px;
      color:var(--muted);
      margin-top:10px;
      line-height:1.25;
    }
    .toast{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      padding:14px 16px;
      border-radius:16px;
      font-weight:900;
      border:1px solid rgba(255,255,255,.16);
      background:rgba(0,0,0,.35);
      backdrop-filter: blur(6px);
      display:none;
      box-shadow:var(--shadow);
    }
    .toast.on{display:block;}
    .toast.ok{outline:2px solid rgba(52,199,89,.55)}
    .toast.bad{outline:2px solid rgba(255,59,48,.55)}
    .edge-flash{
      position:fixed; inset:0; pointer-events:none; opacity:0;
      box-shadow: inset 0 0 0 0 rgba(0,0,0,0);
      transition: opacity .10s ease;
    }
    .edge-flash.on{opacity:1;}
    .edge-flash.ok{box-shadow: inset 0 0 0 10px rgba(52,199,89,.70), inset 0 0 40px 10px rgba(52,199,89,.18);}
    .edge-flash.bad{box-shadow: inset 0 0 0 10px rgba(255,59,48,.72), inset 0 0 40px 10px rgba(255,59,48,.18);}
  </style>
</head>
<body>
  <div class="hud">
    <div class="left">
      <div class="badge">🐱 <span class="muted">Tica</span></div>
      <div class="badge">❤️ <span id="lives">3</span></div>
      <div class="badge">⭐ <span id="score">0</span></div>
      <div class="badge">🔥 <span id="streak">0</span><span class="muted">/5</span></div>
      <div class="badge">🪜 <span id="ladder">1</span><span class="muted">/10</span></div>
    </div>
    <div class="right">
      <button class="btn" id="restartBtn">↻ Reiniciar</button>
      <button class="btn" id="helpBtn">⌨️ Controles</button>
    </div>
  </div>

  <canvas id="c"></canvas>

  <div class="slowmo-vignette" id="slowV"></div>
  <div class="edge-flash" id="edgeFlash"></div>

  <div class="modal" id="modal">
    <div class="card">
      <div class="title">
        <h2>🟣 ¡Shadow Ball! Cámara super lenta…</h2>
        <div class="pill"><span class="t">⏳</span><span id="qTimer">5.0</span>s</div>
      </div>
      <div class="q">
        <div class="expr"><span id="expr"></span></div>
        <div class="row">
          <input id="answer" type="number" inputmode="numeric" placeholder="Escribe la respuesta" />
          <button class="submit" id="submitBtn">Enviar</button>
        </div>
      </div>
      <div class="hint">Suma de centenas. Tienes <b>5 segundos</b>. Si fallas, Tica baja <b>1 escalera</b> (si está en la primera, se queda). ✅ Correcto = +100 puntos.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(() => {
  // ========= Helpers =========
  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
  const rand = (a,b)=>a+Math.random()*(b-a);
  const randi = (a,b)=>Math.floor(rand(a,b+1));
  const now = ()=>performance.now();

  // ========= Canvas =========
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:true });
  function resize(){
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth+'px';
    canvas.style.height = innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize', resize, {passive:true});
  resize();

  // ========= UI =========
  const uiLives = document.getElementById('lives');
  const uiScore = document.getElementById('score');
  const uiStreak = document.getElementById('streak');
  const uiLadder = document.getElementById('ladder');

  const modal = document.getElementById('modal');
  const slowV = document.getElementById('slowV');
  const edgeFlash = document.getElementById('edgeFlash');
  const exprEl = document.getElementById('expr');
  const ansEl = document.getElementById('answer');
  const submitBtn = document.getElementById('submitBtn');
  const qTimerEl = document.getElementById('qTimer');
  const toast = document.getElementById('toast');

  function flashEdge(type){
    edgeFlash.classList.remove('ok','bad','on');
    edgeFlash.classList.add(type, 'on');
    setTimeout(()=>edgeFlash.classList.remove('on'), 140);
  }
  function showToast(type, msg){
    toast.className = 'toast on ' + type;
    toast.textContent = msg;
    setTimeout(()=>toast.classList.remove('on'), 520);
  }

  document.getElementById('restartBtn').addEventListener('click', ()=>resetGame(true));
  document.getElementById('helpBtn').addEventListener('click', ()=>{
    alert(
`Controles:
- Flechas: mover a Tica
- Espacio: saltar (solo en jefe final)
Objetivo:
- Subir 10 escaleras
- Si una Shadow Ball toca a Tica, aparece una suma de centenas con 5s (cámara lenta)
- Correcto: +100 puntos
- Incorrecto: baja 1 escalera (si está en la 1, no baja)
- Racha de 5 correctas: subes más rápido
- 3 vidas: al perderlas, reinicia`
    );
  });

  // ========= Audio (sin archivos externos) =========
  // Pequeños pitidos con WebAudio (para luego reemplazar por sonidos reales)
  let audioCtx = null;
  function beep(freq=660, dur=0.08, type='sine', gain=0.06){
    try{
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  function sfxCorrect(){ beep(880,0.07,'triangle',0.08); setTimeout(()=>beep(1320,0.06,'triangle',0.06), 60); }
  function sfxWrong(){ beep(220,0.10,'sawtooth',0.05); setTimeout(()=>beep(160,0.12,'sawtooth',0.05), 80); }
  function sfxHit(){ beep(520,0.05,'square',0.05); }
  function sfxJump(){ beep(740,0.05,'sine',0.04); }

  // ========= Game constants =========
  const LADDER_COUNT = 10;
  const WORLD = {
    marginX: 54,
    topY: 92,
    bottomY: () => innerHeight - 70,
    laneWidth: () => Math.max(240, Math.min(420, innerWidth * 0.36))
  };

  function laneX(lane){ // lane 0 left, 1 center, 2 right
    const mid = innerWidth * 0.5;
    const w = WORLD.laneWidth();
    if(lane===0) return mid - w;
    if(lane===1) return mid;
    return mid + w;
  }

  // ========= State =========
  const keys = new Set();

  addEventListener('keydown', (e)=>{
    const k = e.key;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
    keys.add(k);
    // allow Enter for submit
    if(question.active && k === 'Enter') submitAnswer();
  }, {passive:false});

  addEventListener('keyup', (e)=>keys.delete(e.key), {passive:true});

  const game = {
    scene: 'climb', // 'climb' | 'boss' | 'win'
    score: 0,
    lives: 3,
    ladder: 1,
    streak: 0,
    streakToBoost: 5,
    climbBoost: 1, // increases on each streak completion
    timeScale: 1,
    slowMoTarget: 1,
    slowMoEase: 0.08,
    spawnT: 0,
    spawnInterval: 1.2,
    lastT: 0
  };

  const tica = {
    x: laneX(1),
    y: WORLD.bottomY(),
    vx: 0,
    vy: 0,
    r: 22,
    onGround: true,
    jumpUsed: false,
  };

  const shadow = {
    x: laneX(1),
    y: WORLD.topY + 30,
    r: 26,
    hood: true,
    bossHits: 0,
  };

  const balls = []; // shadow balls

  const question = {
    active:false,
    a:0,b:0,
    correct:0,
    remaining:0,
    onResolve:null,
  };

  // ========= Game logic =========
  function resetPositions(){
    tica.x = laneX(1);
    tica.y = WORLD.bottomY();
    tica.vx = 0; tica.vy = 0;
    tica.onGround = true;
    tica.jumpUsed = false;

    shadow.x = laneX(1);
    shadow.y = WORLD.topY + 30;
    shadow.bossHits = 0;

    balls.length = 0;
    game.spawnT = 0;
    game.timeScale = 1;
    game.slowMoTarget = 1;
    slowV.classList.remove('on');
    modal.classList.remove('on');
    question.active = false;
  }

  function resetGame(hard=false){
    if(hard){
      game.score = 0;
      game.lives = 3;
      game.ladder = 1;
      game.streak = 0;
      game.climbBoost = 1;
      game.scene = 'climb';
    }
    resetPositions();
    syncUI();
  }

  function syncUI(){
    uiLives.textContent = game.lives;
    uiScore.textContent = game.score;
    uiStreak.textContent = game.streak;
    uiLadder.textContent = game.ladder;
  }

  function loseLife(){
    game.lives -= 1;
    syncUI();
    if(game.lives <= 0){
      // full reset
      showToast('bad','💥 0 vidas: reinicio');
      resetGame(true);
    } else {
      showToast('bad',`💔 Vida perdida (${game.lives})`);
      resetPositions();
    }
  }

  function ladderDown(){
    if(game.ladder > 1) game.ladder -= 1;
    // move Tica down visually
    tica.y = ladderY(game.ladder);
    syncUI();
  }

  function ladderUp(){
    if(game.ladder < LADDER_COUNT){
      game.ladder += 1;
      tica.y = ladderY(game.ladder);
      syncUI();
      if(game.ladder === LADDER_COUNT){
        // transition to boss
        game.scene = 'boss';
        balls.length = 0;
        showToast('ok','👿 ¡Jefe final: Shadow!');
      }
    } else {
      // already at top
      game.scene = 'boss';
    }
  }

  function ladderY(ladderIndex){
    // evenly spaced ladders from bottom to top
    const top = WORLD.topY + 90;
    const bottom = WORLD.bottomY();
    const t = (ladderIndex-1) / (LADDER_COUNT-1);
    return bottom - t*(bottom-top);
  }

  function spawnBall(){
    // in climb scene: spawn from top lanes, toward center-ish
    const lane = randi(0,2);
    const startX = laneX(lane);
    const startY = WORLD.topY + 10;

    // balls drift toward center to give chance
    const targetX = laneX(1) + rand(-90,90);
    const dirX = (targetX - startX);
    const base = 160 + (game.ladder-1)*10; // speed grows a bit as you climb
    const vx = clamp(dirX, -220, 220) * 0.6;
    const vy = base;

    balls.push({
      x:startX, y:startY,
      vx, vy,
      r: 18,
      t: 0,
      phase: rand(0, Math.PI*2),
      alive:true,
      fromBoss:false
    });
  }

  function spawnBallBoss(){
    // boss: shadow throws horizontally or diagonally toward Tica
    const startX = shadow.x + rand(-20,20);
    const startY = shadow.y + 20;
    const dx = (tica.x - startX);
    const dy = (tica.y - startY);
    const len = Math.max(1, Math.hypot(dx,dy));
    const speed = 240 + shadow.bossHits*20;
    balls.push({
      x:startX, y:startY,
      vx:(dx/len)*speed,
      vy:(dy/len)*speed*0.45,
      r: 18,
      t:0,
      phase: rand(0, Math.PI*2),
      alive:true,
      fromBoss:true
    });
  }

  function ballHitsTica(b){
    const dx = b.x - tica.x;
    const dy = b.y - tica.y;
    const rr = b.r + tica.r;
    return (dx*dx + dy*dy) <= rr*rr;
  }

  function startQuestion(){
    // hundreds addition
    question.a = randi(100, 999);
    question.b = randi(100, 999);
    question.correct = question.a + question.b;
    question.remaining = 5.0;
    question.active = true;

    exprEl.textContent = `${question.a} + ${question.b} = ?`;
    qTimerEl.textContent = question.remaining.toFixed(1);
    ansEl.value = '';
    modal.classList.add('on');

    // SUPER SLOW CAMERA MODE (world slows, input to world locked)
    game.slowMoTarget = 0.12;
    slowV.classList.add('on');

    // focus input
    setTimeout(()=>ansEl.focus(), 0);
  }

  function endQuestion(){
    question.active = false;
    modal.classList.remove('on');
    game.slowMoTarget = 1;
    slowV.classList.remove('on');
  }

  function submitAnswer(){
    if(!question.active) return;
    const val = Number(ansEl.value);
    const ok = Number.isFinite(val) && val === question.correct;

    endQuestion();

    if(ok){
      game.score += 100;
      game.streak += 1;
      sfxCorrect();
      flashEdge('ok');
      showToast('ok','✅ ¡Correcto! +100');

      if(game.streak % game.streakToBoost === 0){
        game.climbBoost = clamp(game.climbBoost + 0.25, 1, 2.4);
        showToast('ok',`🔥 Racha ${game.streak}: ¡subes más rápido!`);
      }
    } else {
      game.streak = 0;
      sfxWrong();
      flashEdge('bad');
      showToast('bad','❌ Incorrecto: bajas 1 escalera');
      ladderDown();
      // If you want: lose life only on repeated mistakes, but spec says 3 vidas and reinicia.
      // We'll make a wrong answer also costs a life to add arcade tension:
      loseLife();
    }
    syncUI();
  }

  submitBtn.addEventListener('click', submitAnswer);

  // If timer runs out: treat as wrong
  function tickQuestion(dtReal){
    if(!question.active) return;
    question.remaining -= dtReal;
    qTimerEl.textContent = Math.max(0, question.remaining).toFixed(1);
    if(question.remaining <= 0){
      endQuestion();
      game.streak = 0;
      sfxWrong();
      flashEdge('bad');
      showToast('bad','⏱️ Tiempo agotado: bajas 1 escalera');
      ladderDown();
      loseLife();
      syncUI();
    }
  }

  // ========= Movement =========
  function updateClimb(dt){
    // lock world movement while question active (but keep slow visuals by timeScale)
    const lock = question.active;

    // base speeds (pixel/s)
    const lateralSpeed = 260;
    const climbBase = 150; // how fast you advance ladders with Up
    const climbSpeed = climbBase * game.climbBoost;

    if(!lock){
      let vx = 0;
      if(keys.has('ArrowLeft')) vx -= lateralSpeed;
      if(keys.has('ArrowRight')) vx += lateralSpeed;
      tica.x += vx * dt;
      tica.x = clamp(tica.x, WORLD.marginX, innerWidth - WORLD.marginX);

      // Up to climb to next ladder (discrete) with cooldown feeling
      // We'll treat ladders as discrete levels: holding Up climbs with rate based on climbSpeed.
      if(keys.has('ArrowUp')){
        game._climbAcc = (game._climbAcc || 0) + climbSpeed * dt;
        if(game._climbAcc >= 100){
          game._climbAcc = 0;
          ladderUp();
          sfxHit();
        }
      } else {
        game._climbAcc = 0;
      }
      if(keys.has('ArrowDown')){
        game._downAcc = (game._downAcc || 0) + 170 * dt;
        if(game._downAcc >= 120){
          game._downAcc = 0;
          ladderDown();
          sfxHit();
        }
      } else {
        game._downAcc = 0;
      }

      // keep Tica snapped to ladder Y
      tica.y = ladderY(game.ladder);
    }

    // Spawn balls
    game.spawnT += dt;
    const interval = clamp(game.spawnInterval - (game.ladder-1)*0.06, 0.55, 1.25);
    if(game.spawnT >= interval){
      game.spawnT = 0;
      spawnBall();
    }

    // Update balls
    for(const b of balls){
      b.t += dt;
      // wobble + drift
      b.x += (b.vx * dt) + Math.sin(b.t*6 + b.phase) * 14 * dt;
      b.y += (b.vy * dt);
      // remove if offscreen
      if(b.y > innerHeight + 60 || b.x < -80 || b.x > innerWidth + 80) b.alive = false;

      if(!question.active && ballHitsTica(b)){
        b.alive = false;
        sfxHit();
        startQuestion();
      }
    }
    // compact
    for(let i=balls.length-1;i>=0;i--) if(!balls[i].alive) balls.splice(i,1);
  }

  function updateBoss(dt){
    const lock = question.active;

    // physics for jump
    const g = 1200;
    const lateralSpeed = 300;

    if(!lock){
      let vx = 0;
      if(keys.has('ArrowLeft')) vx -= lateralSpeed;
      if(keys.has('ArrowRight')) vx += lateralSpeed;

      tica.vx = vx;
      tica.x += tica.vx * dt;
      tica.x = clamp(tica.x, WORLD.marginX, innerWidth - WORLD.marginX);

      const groundY = innerHeight - 90;
      if(tica.onGround){
        tica.y = groundY;
        tica.vy = 0;
        tica.jumpUsed = false;
        if(keys.has(' ')){
          tica.onGround = false;
          tica.vy = -520;
          sfxJump();
        }
      } else {
        tica.vy += g * dt;
        tica.y += tica.vy * dt;
        if(tica.y >= groundY){
          tica.y = groundY;
          tica.onGround = true;
        }
      }

      // Shadow stays near top
      shadow.x = laneX(1);
      shadow.y = WORLD.topY + 70;

      // Spawn boss balls
      game.spawnT += dt;
      const bossInterval = clamp(1.15 - shadow.bossHits*0.1, 0.45, 1.15);
      if(game.spawnT >= bossInterval){
        game.spawnT = 0;
        spawnBallBoss();
      }

      // Stomp detection: Tica lands on Shadow from above
      const dx = tica.x - shadow.x;
      const dy = (tica.y - shadow.y);
      const rr = tica.r + shadow.r;
      const isClose = (dx*dx + dy*dy) <= (rr*rr);
      const falling = tica.vy > 80;

      if(isClose && falling && tica.y < shadow.y + 18){
        shadow.bossHits += 1;
        tica.vy = -420; // bounce
        tica.onGround = false;
        sfxCorrect();
        flashEdge('ok');
        showToast('ok',`💥 Golpe ${shadow.bossHits}/3`);
        if(shadow.bossHits >= 3){
          game.scene = 'win';
          balls.length = 0;
          showToast('ok','💎 ¡Ganaste! Diamantes del multiverso salvados');
        }
      }

      // Balls update + collision -> question
      for(const b of balls){
        b.t += dt;
        b.x += (b.vx * dt) + Math.sin(b.t*7 + b.phase) * 18 * dt;
        b.y += (b.vy * dt) + Math.sin(b.t*5 + b.phase) * 6 * dt;
        if(b.y > innerHeight + 60 || b.x < -120 || b.x > innerWidth + 120) b.alive = false;

        if(!question.active && ballHitsTica(b)){
          b.alive = false;
          sfxHit();
          startQuestion();
        }
      }
      for(let i=balls.length-1;i>=0;i--) if(!balls[i].alive) balls.splice(i,1);
    }

    // Even if locked, keep slight visual drift by timeScale in draw
  }

  // ========= Rendering =========
  function drawBackground(){
    // subtle stars
    ctx.save();
    ctx.globalAlpha = 0.75;
    for(let i=0;i<38;i++){
      const x = (i*97 + (Math.sin(i*3.1)*50)) % innerWidth;
      const y = (i*61 + (Math.cos(i*2.7)*50)) % innerHeight;
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      ctx.fillRect(x, y, 2, 2);
    }
    ctx.restore();
  }

  function drawClimbScene(){
    // Platforms / ladders vibe (simple retro)
    const top = WORLD.topY + 90;
    const bottom = WORLD.bottomY();
    const leftX = WORLD.marginX;
    const rightX = innerWidth - WORLD.marginX;

    // Floors at each ladder level
    ctx.save();
    for(let i=1;i<=LADDER_COUNT;i++){
      const y = ladderY(i);
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = 'rgba(255,255,255,.10)';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(leftX, y);
      ctx.lineTo(rightX, y);
      ctx.stroke();

      // tiny pixels
      ctx.globalAlpha = 0.22;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for(let x=leftX; x<rightX; x+=18){
        ctx.moveTo(x, y-5);
        ctx.lineTo(x+8, y-5);
      }
      ctx.stroke();
    }
    ctx.restore();

    // Ladders (center)
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.16)';
    ctx.lineWidth = 6;
    const lx = laneX(1);
    ctx.beginPath();
    ctx.moveTo(lx-14, top);
    ctx.lineTo(lx-14, bottom);
    ctx.moveTo(lx+14, top);
    ctx.lineTo(lx+14, bottom);
    ctx.stroke();

    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    for(let y=top; y<bottom; y+=26){
      ctx.beginPath();
      ctx.moveTo(lx-14, y);
      ctx.lineTo(lx+14, y);
      ctx.stroke();
    }
    ctx.restore();

    // Shadow (top)
    drawShadow(shadow.x, WORLD.topY + 28, 24);

    // Tica
    drawTica(tica.x, tica.y, tica.r);

    // Balls
    for(const b of balls) drawBall(b.x, b.y, b.r);
  }

  function drawBossScene(){
    // Arena
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(WORLD.marginX, innerHeight - 90);
    ctx.lineTo(innerWidth - WORLD.marginX, innerHeight - 90);
    ctx.stroke();
    ctx.restore();

    // Title / objective
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = '900 16px system-ui';
    ctx.fillText(`Jefe Final: Shadow — salta encima 3 veces (${shadow.bossHits}/3)`, 18, 78);
    ctx.restore();

    drawShadow(shadow.x, shadow.y, shadow.r);
    drawTica(tica.x, tica.y, tica.r);
    for(const b of balls) drawBall(b.x, b.y, b.r);
  }

  function drawWinScene(){
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.font = '900 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('💎 ¡Tesoro del Multiverso Salvado!', innerWidth/2, innerHeight/2 - 18);
    ctx.font = '700 16px system-ui';
    ctx.fillStyle = 'rgba(203,213,225,.95)';
    ctx.fillText('Presiona ↻ Reiniciar para volver a jugar', innerWidth/2, innerHeight/2 + 18);
    ctx.restore();

    // tiny diamonds
    ctx.save();
    for(let i=0;i<24;i++){
      const x = (innerWidth/2) + Math.sin(i*1.7)*220 + rand(-30,30);
      const y = (innerHeight/2) + Math.cos(i*2.1)*120 + rand(-20,20);
      ctx.font = '24px system-ui';
      ctx.fillText('💠', x, y);
    }
    ctx.restore();
  }

  // Emoji “sprites”
  function drawTica(x,y,r){
    ctx.save();
    // glow
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = 'rgba(255,120,200,.25)';
    ctx.beginPath(); ctx.arc(x,y,r+10,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.font = `${r*2}px system-ui`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐱', x, y);
    // bow accent
    ctx.font = `${r*0.95}px system-ui`;
    ctx.fillText('🎀', x + r*0.55, y - r*0.65);
    ctx.restore();
  }

  function drawShadow(x,y,r){
    ctx.save();
    // purple aura
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = 'rgba(181,107,255,.25)';
    ctx.beginPath(); ctx.arc(x,y,r+14,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = `${r*2}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('😼', x, y);
    // hood
    ctx.font = `${r*1.2}px system-ui`;
    ctx.fillText('🧥', x, y + r*0.15);
    // purple eyes hint
    ctx.font = `${r*0.9}px system-ui`;
    ctx.fillText('💜', x + r*0.55, y - r*0.35);
    ctx.restore();
  }

  function drawBall(x,y,r){
    ctx.save();
    // plasma glow
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = 'rgba(181,107,255,.22)';
    ctx.beginPath(); ctx.arc(x,y,r+16,0,Math.PI*2); ctx.fill();

    // core orb (emoji placeholder)
    ctx.globalAlpha = 1;
    ctx.font = `${r*2}px system-ui`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🟣', x, y);

    // lightning rays
    ctx.globalAlpha = 0.85;
    ctx.font = `${r*1.1}px system-ui`;
    ctx.fillText('⚡', x + r*0.95, y - r*0.25);
    ctx.fillText('💜', x - r*0.95, y + r*0.25);
    ctx.restore();
  }

  // ========= Main loop with time control =========
  function loop(t){
    const tms = t;
    const dtReal = clamp((tms - (game.lastT || tms)) / 1000, 0, 0.05);
    game.lastT = tms;

    // Smooth timeScale toward target (camera slow motion)
    game.timeScale += (game.slowMoTarget - game.timeScale) * game.slowMoEase;
    const dt = dtReal * game.timeScale;

    // Question timer uses REAL time (so always 5s exact for the user)
    tickQuestion(dtReal);

    // Update
    if(game.scene === 'climb') updateClimb(dt);
    else if(game.scene === 'boss') updateBoss(dt);
    // win has no update

    // Draw
    ctx.clearRect(0,0,innerWidth,innerHeight);
    drawBackground();

    // subtle slow motion “trail” feel
    if(game.timeScale < 0.6){
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = 'rgba(181,107,255,.18)';
      ctx.fillRect(0,0,innerWidth,innerHeight);
      ctx.restore();
    }

    if(game.scene === 'climb') drawClimbScene();
    else if(game.scene === 'boss') drawBossScene();
    else drawWinScene();

    requestAnimationFrame(loop);
  }

  // ========= Start =========
  // Initial ladder Y
  tica.y = ladderY(game.ladder);
  syncUI();
  requestAnimationFrame(loop);

})();
</script>
